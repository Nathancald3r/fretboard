<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretboard aligner</title>
<style>
  :root { --bg: #14161a; --panel: #1d2026; --line: #343a44; --text: #e8eaee; --dim: #9aa3b0; --tab: #5aa9ff; --vid: #ffb347; --mark: #3fe0d0; --cut: #ff6b9a; --play: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header select, header button { background: #272c35; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  header button:hover { background: #313845; }
  header button.primary { background: #2b6fd6; border-color: #2b6fd6; font-weight: 600; }
  header button.on { outline: 2px solid var(--mark); }
  header .grow { flex: 1; }
  #status { color: var(--dim); min-width: 12em; }
  #status.err { color: #ff8a8a; }
  #status.ok { color: #7be39a; }
  main { flex: 1; min-height: 180px; position: relative; }
  body { overflow: auto; }
  details summary { cursor: pointer; color: var(--dim); }
  details[open] summary { margin-bottom: 4px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  footer { padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  footer b { color: var(--text); font-weight: 600; }
  #readout { color: var(--text); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  #hint { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--dim); font-size: 17px; pointer-events: none; }
  #mixbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4px 28px; margin: 4px 0 8px; }
  .mixcol h4 { margin: 0 0 2px; font-size: 13px; color: var(--text); }
  .mixrow { display: grid; grid-template-columns: 8.5em 1fr 3.4em 1.9em 1.9em; gap: 6px; align-items: center; }
  .mixrow.master { border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 3px; }
  .mixrow input[type=range] { width: 100%; margin: 0; }
  .mixrow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mixrow .v { text-align: right; font-variant-numeric: tabular-nums; }
  .mixrow button { background: #272c35; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0; font: 11px ui-monospace, Consolas, monospace; cursor: pointer; height: 20px; }
  .mixrow button.on { background: #b3472f; color: #fff; border-color: #b3472f; }
  .mixrow button.solo.on { background: #2b6fd6; border-color: #2b6fd6; }
  .mixnote { color: var(--dim); font-size: 12px; }
  kbd { background: #2a2f38; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, Consolas, monospace; color: var(--text); }
  header { row-gap: 6px; padding: 6px 12px; }
  header select { max-width: 230px; }
  header button { padding: 5px 9px; }
  #toggles .grow { flex: 1; }
  #toggles #status { min-width: 0; text-align: right; }
  .grp { position: relative; display: flex; align-items: center; gap: 4px; padding: 15px 6px 5px; border: 1px solid var(--line); border-radius: 8px; }
  .grp .gl { position: absolute; top: 1px; left: 8px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
  header button kbd { margin-left: 7px; padding: 0 4px; font-size: 11px; color: var(--dim); background: #1d2026; }
  header button.primary kbd { color: #cfe0ff; background: #2459ad; border-color: #2459ad; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; padding: 6px 8px; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button kbd { margin: 0 5px 0 0; }
  .seg button.on { outline: none; background: #2b6fd6; border-color: #2b6fd6; }
  .seg button.on kbd { color: #cfe0ff; background: #2459ad; border-color: #2459ad; }
  #toggles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 12px; background: #181b21; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: #272c35; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 11px 1px 5px; font: inherit; cursor: pointer; }
  .chip:hover { background: #313845; }
  .chip.on { color: var(--text); border-color: var(--mark); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a515d; }
  .chip.on .dot { background: var(--mark); }
  .hintline { margin: 2px 0 4px; }
  #help { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .62); }
  #help[hidden] { display: none; }
  #help .card { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; width: min(1000px, 100%); max-height: 92vh; overflow: auto; padding: 14px 20px 18px; }
  #help .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  #help h3 { margin: 0; font-size: 17px; flex: 1; }
  #help .x { background: #272c35; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
  #help .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 30px; }
  #help h4 { margin: 0 0 5px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mark); }
  #help .row { display: grid; grid-template-columns: 10.5em 1fr; gap: 8px; padding: 3px 0; font-size: 13px; border-bottom: 1px solid #262b33; }
  #help .row .k { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  #help .row .m { color: var(--vid); }
  #help .row .d { color: var(--dim); }
</style>
</head>
<body>
<header>
  <select id="song" aria-label="Song"></select>
  <div class="grp"><span class="gl">Play</span>
    <button id="play" title="Play from the marker (Space)"><span class="lbl">▶ Play</span><kbd>Space</kbd></button>
    <button id="head" title="Centre the view on the playhead (P)">To playhead<kbd>P</kbd></button>
    <button id="follow" title="Keep the playhead in the middle while playing (F)">Follow<kbd>F</kbd></button>
  </div>
  <div class="grp"><span class="gl">Zoom</span><div class="seg" id="zoom"></div></div>
  <div class="grp" title="Cut the song into sections that each get their own shift"><span class="gl">Sections</span>
    <button id="match" title="Find the shift here by matching the note starts (M)">Match<kbd>M</kbd></button>
    <button id="cut" title="Start a new section at the nearest bar line (A, or double-click the waveform)">Cut<kbd>A</kbd></button>
    <button id="uncut" title="Join this section to the one before it (Delete)">Join<kbd>Del</kbd></button>
  </div>
  <div class="grp" title="Pick a section by clicking its name above the waveform, then squeeze or stretch the video across it"><span class="gl">Picked section</span>
    <button id="sq" title="Squeeze: the video's end moves toward its start ( [ ). Shift-click = 100 ms">Squeeze<kbd>[</kbd></button>
    <button id="st" title="Stretch ( ] ). Shift-click = 100 ms">Stretch<kbd>]</kbd></button>
    <button id="lock" title="Back to the tab's tempo: the section only moves, it is not squeezed (K)">Lock tempo<kbd>K</kbd></button>
  </div>
  <div class="grp"><span class="gl">Edit</span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo<kbd>Ctrl Z</kbd></button>
    <button id="reset" title="Go back to the sync as it was opened">Reset</button>
  </div>
  <span class="grow"></span>
  <button id="helpbtn" title="All the shortcuts (?)">Shortcuts<kbd>?</kbd></button>
  <button id="save" class="primary" title="Write the sync into the song's .fretboard file (Ctrl+S)">Save<kbd>Ctrl S</kbd></button>
</header>
<div id="toggles"><span>Sound and look:</span><span class="grow"></span><span id="status"></span></div>
<main>
  <canvas id="c"></canvas>
  <div id="hint"></div>
</main>
<footer>
  <div id="readout"></div>
  <details id="mix"><summary>Loudness: the whole mix and each instrument</summary>
    <div id="mixbox"></div>
  </details>
  <div class="hintline">The key for each button is on it. <kbd>?</kbd> shows every shortcut, and the mouse ones too.</div>
</footer>
<div id="help" hidden>
  <div class="card" role="dialog" aria-label="Shortcuts">
    <div class="top"><h3>Shortcuts</h3><span class="d" style="color:var(--dim);font-size:13px">orange = mouse</span><button class="x" id="helpx">Close <kbd>Esc</kbd></button></div>
    <div class="grid" id="helpgrid"></div>
  </div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#c'), g = cv.getContext('2d');
const SPANS = [0, 45, 12, 3, 0.6]; // zoom keys 2-5 (key 1 is the whole song)
const H = 0.005; // the match works on 5 ms steps

const S = {
  slug: null, name: '', bars: [], pts: [], notes: [], noteT: [], file: '', total: 0, rate: 22050,
  tab: null, rec: null, onTab: null, onRec: null,
  bx: [], by: [], sec: [{ i: 0, s: 0 }], sec0: null,
  view: { t0: 0, span: 60 }, level: 1, marker: 0, hover: null,
  overlay: true, boost: true, auto: true, split: true, mute: { tab: false, rec: false },
  play: null, dirty: false, undo: [], lastPush: 0, saved: false, follow: false, selSec: null,
  mix: { tab: { g: 1, rows: [], bufs: {}, active: false }, rec: { g: 1, rows: [], bufs: {}, active: false } }, tabDraw: null, recDraw: null,
};
let ctx = null, dirty = true;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- status ---------- */
function say(text, kind = '') { const el = $('#status'); el.textContent = text; el.className = kind; }
function hint(text) { const el = $('#hint'); el.style.display = text ? 'grid' : 'none'; el.textContent = text || ''; }

/* ---------- the sync map ---------- */
// base(t): where tab time t sits in the video, as the file has it (bar by bar, straight between bars).
function buildBase() {
  const X = [], Y = [];
  for (const [i, ms] of S.pts) {
    const t = S.bars[i]?.[0], y = ms / 1000;
    if (t === undefined || (X.length && (t <= X[X.length - 1] || y <= Y[Y.length - 1]))) continue;
    X.push(t); Y.push(y);
  }
  S.bx = X; S.by = Y;
}
function seg(xs, v) {
  const n = xs.length;
  if (v <= xs[0]) return 0;
  if (v >= xs[n - 1]) return n - 2;
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] <= v) lo = m; else hi = m; }
  return lo;
}
function lerpMap(xs, ys, v) {
  const n = xs.length;
  if (n === 0) return v;
  if (n === 1) return ys[0] + (v - xs[0]);
  const k = seg(xs, v);
  return ys[k] + (v - xs[k]) * (ys[k + 1] - ys[k]) / (xs[k + 1] - xs[k]);
}
const base = (t) => lerpMap(S.bx, S.by, t);
const slopeAt = (t) => { const n = S.bx.length; if (n < 2) return 1; const k = seg(S.bx, t); return (S.by[k + 1] - S.by[k]) / (S.bx[k + 1] - S.bx[k]); };
const barT = (i) => S.bars[i][0];
function secAt(t) { let k = 0; for (let j = 1; j < S.sec.length; j++) if (barT(S.sec[j].i) <= t + 1e-6) k = j; return k; }
// A section is { i: first bar, s: shift at its start (ms), sq: how much further the shift is by its end (ms) }.
// sq = 0 is "locked to the tab's tempo": the video only moves. A squish (sq ≠ 0) stretches the video across the section.
const secEnd = (k) => (k + 1 < S.sec.length ? barT(S.sec[k + 1].i) : S.total);
function shiftAt(t) { // ms: how far the video picture is moved right
  const k = secAt(t), x = S.sec[k], sq = x.sq || 0;
  if (!sq) return x.s;
  const a = barT(x.i), b = secEnd(k);
  return x.s + sq * clamp((t - a) / (b - a || 1), 0, 1);
}
const rec = (t) => base(t) - shiftAt(t) / 1000; // the video time that plays with tab time t
function barAtTime(t) { let b = 0; for (let i = 0; i < S.bars.length; i++) if (barT(i) <= t + 1e-6) b = i; return b; }
function nearestBar(t) { let b = 0, d = 1e9; for (let i = 0; i < S.bars.length; i++) { const x = Math.abs(barT(i) - t); if (x < d) { d = x; b = i; } } return b; }

/* ---------- waveform pyramids ---------- */
function pyramid(x) {
  const B0 = 32, levels = [];
  let n = Math.ceil(x.length / B0), mm = new Float32Array(n * 2);
  for (let b = 0; b < n; b++) {
    let lo = 1, hi = -1;
    for (let i = b * B0, e = Math.min(x.length, i + B0); i < e; i++) { const v = x[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    mm[b * 2] = lo; mm[b * 2 + 1] = hi;
  }
  levels.push({ B: B0, mm });
  while (n > 1) {
    const prev = levels[levels.length - 1].mm, n2 = Math.ceil(n / 2), next = new Float32Array(n2 * 2);
    for (let b = 0; b < n2; b++) {
      const a = b * 2, c = Math.min(n - 1, a + 1);
      next[b * 2] = Math.min(prev[a * 2], prev[c * 2]);
      next[b * 2 + 1] = Math.max(prev[a * 2 + 1], prev[c * 2 + 1]);
    }
    levels.push({ B: levels[levels.length - 1].B * 2, mm: next });
    n = n2;
  }
  return { x, levels };
}
const OUT = [0, 0];
function query(p, a, b) {
  const n = p.x.length;
  a = clamp(Math.floor(a), 0, n - 1); b = clamp(Math.ceil(b), a + 1, n);
  let lo = 1, hi = -1;
  if (b - a <= 64) {
    for (let i = a; i < b; i++) { const v = p.x[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  } else {
    let L = 0;
    while (L + 1 < p.levels.length && p.levels[L + 1].B <= (b - a) / 2) L++;
    const { B, mm } = p.levels[L];
    for (let k = Math.floor(a / B), e = Math.min(mm.length / 2, Math.ceil(b / B)); k < e; k++) {
      if (mm[k * 2] < lo) lo = mm[k * 2];
      if (mm[k * 2 + 1] > hi) hi = mm[k * 2 + 1];
    }
  }
  OUT[0] = lo; OUT[1] = hi;
  return OUT;
}

/* ---------- note-start signals, for "match here" ---------- */
function onsets(x, rate) {
  const hop = Math.round(rate * H), n = Math.floor(x.length / hop), env = new Float32Array(n), on = new Float32Array(n);
  for (let k = 0; k < n; k++) { let s = 0; for (let i = k * hop, e = i + hop; i < e; i++) s += x[i] * x[i]; env[k] = Math.sqrt(Math.sqrt(s / hop)); }
  for (let k = 1; k < n; k++) on[k] = Math.max(0, env[k] - env[k - 1]);
  const out = new Float32Array(n); // blurred by ±10 ms so a synth note and a real one can agree despite their different attack
  for (let k = 0; k < n; k++) {
    let s = 0, w = 0;
    for (let j = -2; j <= 2; j++) { const v = on[k + j]; if (v !== undefined) { const c = 3 - Math.abs(j); s += v * c; w += c; } }
    out[k] = s / w;
  }
  return out;
}
function matchHere() {
  const half = 3.5, t0 = Math.max(0, S.marker - half), t1 = Math.min(S.total, S.marker + half), K = Math.floor((t1 - t0) / H);
  if (K < 200) { say('Too close to the end to match here.', 'err'); return; }
  const tv = new Float32Array(K), tIdx = new Int32Array(K);
  for (let j = 0; j < K; j++) { tIdx[j] = Math.round((t0 + j * H) / H); tv[j] = S.onTab[tIdx[j]] || 0; }
  const norm = (v) => { let m = 0; for (const x of v) m += x; m /= v.length; let s = 0; for (const x of v) s += (x - m) * (x - m); s = Math.sqrt(s / v.length) || 1; return [m, s]; };
  const [mt, st] = norm(tv);
  const L = 200, scores = new Float32Array(2 * L + 1), rv = new Float32Array(K);
  for (let l = -L; l <= L; l++) {
    for (let j = 0; j < K; j++) rv[j] = S.onRec[Math.round(rec(t0 + j * H) / H) + l] || 0;
    const [mr, sr] = norm(rv);
    let acc = 0;
    for (let j = 0; j < K; j++) acc += (tv[j] - mt) * (rv[j] - mr);
    scores[l + L] = acc / K / (st * sr);
  }
  let best = 0;
  for (let i = 1; i < scores.length; i++) if (scores[i] > scores[best]) best = i;
  // a steady beat matches at every beat too: among peaks nearly as good as the best, take the one nearest the current shift
  const top = scores[best];
  let alias = false;
  for (let i = 1; i < scores.length - 1; i++) {
    if (scores[i] >= top * 0.85 && scores[i] >= scores[i - 1] && scores[i] >= scores[i + 1] && Math.abs(i - L) < Math.abs(best - L)) { best = i; alias = true; }
  }
  const c = scores[best];
  if (c < 0.2 || best === 0 || best === scores.length - 1) { say(`No clear match here (${c.toFixed(2)}). Try a part with a clear beat, or nudge closer first (it looks ±1 s).`, 'err'); return; }
  const a = scores[best - 1], b = scores[best + 1], d = (a - b) / (2 * (a - 2 * c + b) || 1);
  const delta = (best - L + d) * H; // seconds: the video should be read this much later than now
  pushUndo(true);
  S.sec[secAt(S.marker)].s = Math.round(S.sec[secAt(S.marker)].s - delta * 1000);
  changed();
  say(`Matched here: section ${secAt(S.marker) + 1} is now ${fmtMs(S.sec[secAt(S.marker)].s)} (confidence ${c.toFixed(2)}${alias ? ', took the nearest of several beat matches' : ''}). Check it by eye and ear.`, 'ok');
}

/* ---------- undo, sections ---------- */
const snap = () => JSON.stringify(S.sec);
function pushUndo(force) {
  const now = performance.now();
  if (force || now - S.lastPush > 700) S.undo.push(snap());
  S.lastPush = now;
  if (S.undo.length > 200) S.undo.shift();
}
function undo() { const s = S.undo.pop(); if (!s) return; S.sec = JSON.parse(s); changed(); say('Undone.'); }
function changed() { S.dirty = true; dirty = true; S.saved = false; if (S.play) restartSoon(); }
const fmtMs = (ms) => (ms > 0 ? '+' : ms < 0 ? '−' : '') + Math.abs(Math.round(ms)) + ' ms';

// The section the keys and buttons act on: the one picked by clicking its name, else the one under the marker.
const curSec = () => (S.selSec !== null && S.selSec < S.sec.length ? S.selSec : secAt(S.marker));
// How much the video is squeezed (+) or stretched (−) across section k, against the tab's own tempo.
function squeezeNote(k) {
  const x = S.sec[k], a = barT(x.i), b = secEnd(k), span = base(b) - base(a) || 1, r = 1 - (x.sq || 0) / 1000 / span;
  return Math.abs(r - 1) < 0.0005 ? 'locked to the tab’s tempo' : `video ${r > 1 ? 'squeezed' : 'stretched'} ${(Math.abs(r - 1) * 100).toFixed(1)}%`;
}
function nudge(ms) {
  const k = curSec();
  pushUndo(false);
  S.sec[k].s += ms;
  changed();
  say(`Section ${k + 1}: video moved ${fmtMs(S.sec[k].s)} (right = later)`);
}
function squeeze(ms) { // ms > 0 stretches, ms < 0 squeezes: the video at the section's end moves, its start stays
  const k = curSec();
  pushUndo(false);
  S.sec[k].sq = (S.sec[k].sq || 0) + ms;
  changed();
  say(`Section ${k + 1} (bar ${S.bars[S.sec[k].i][1]} on): ${squeezeNote(k)}.`);
}
function lockTempo() {
  const k = curSec();
  if (!S.sec[k].sq) { say(`Section ${k + 1} is already locked to the tab’s tempo.`); return; }
  pushUndo(true);
  S.sec[k].sq = 0;
  changed();
  say(`Section ${k + 1}: back to the tab’s tempo (the video only moves).`);
}
function cutHere(at) {
  const j = nearestBar(at ?? S.marker);
  if (j === 0 || S.sec.some((x) => x.i === j)) { say(j === 0 ? 'The song starts there already.' : 'There is a cut at this bar already.'); return; }
  pushUndo(true);
  const L = S.sec[secAt(barT(j) - 1e-4)], sq = L.sq || 0, frac = (barT(j) - barT(L.i)) / (secEnd(S.sec.indexOf(L)) - barT(L.i) || 1);
  const sj = L.s + sq * frac, endL = L.s + sq; // the map stays as it was: the left part ends where the new part starts
  L.sq = sj - L.s;
  S.sec.push({ i: j, s: sj, sq: endL - sj }); S.sec.sort((a, b) => a.i - b.i);
  S.selSec = S.sec.findIndex((x) => x.i === j);
  if (at === undefined) S.marker = barT(j);
  changed();
  say(`New section ${S.selSec + 1} from bar ${S.bars[j][1]}, picked: move it with ← →, squeeze it with [ ].`);
}
function joinHere() {
  let k = S.sec.findIndex((x) => x.i === nearestBar(S.marker));
  if (k < 1) k = curSec();
  if (k < 1) { say('Nothing to join: this is the first section.'); return; }
  pushUndo(true);
  const L = S.sec[k - 1], R = S.sec[k];
  L.sq = R.s + (R.sq || 0) - L.s; // the joined section ends where the right one ended
  S.sec.splice(k, 1); S.selSec = k - 1;
  changed();
  say('Joined with the section before it.');
}
function reset() {
  if (!S.sec0) return;
  pushUndo(true); S.sec = JSON.parse(S.sec0); S.selSec = null; changed(); say('Back to the sync as it was opened.');
}

/* ---------- view ---------- */
function setLevel(k) {
  S.level = k;
  const span = k === 1 ? S.total : Math.min(S.total, SPANS[k - 1]);
  S.view.span = span;

function savePoints() {

async function save() {
  if (!S.tab) return;

  say('Saving…');
  const r = await fetch(`/api/save/${S.slug}`, { method: 'POST', body: JSON.stringify({ points: savePoints(), note: shifts }) });
  const d = await r.json();

/* ---------- shortcuts on screen: the zoom and toggle bars, and the list ---------- */
// The six switches, one definition for the key and the chip that shows its state.
const TOGGLES = [
  { code: 'KeyT', key: 'T', label: 'Tab sound', on: () => !S.mute.tab, run: () => { S.mute.tab = !S.mute.tab; applyGains(); paintMixer(); say(S.mute.tab ? 'Tab sound off.' : 'Tab sound on.'); } },
  { code: 'KeyV', key: 'V', label: 'Video sound', on: () => !S.mute.rec, run: () => { S.mute.rec = !S.mute.rec; applyGains(); paintMixer(); say(S.mute.rec ? 'Video sound off.' : 'Video sound on.'); } },
  { code: 'KeyE', key: 'E', label: 'One ear each', on: () => S.split, run: () => { S.split = !S.split; applyGains(); say(S.split ? 'Video in the left ear, tab in the right.' : 'Both in the middle.'); } },
  { code: 'KeyO', key: 'O', label: 'Overlay', on: () => S.overlay, run: () => { S.overlay = !S.overlay; dirty = true; say(S.overlay ? 'Both waveforms on top of each other.' : 'Waveforms stacked.'); } },
  { code: 'KeyL', key: 'L', label: 'Auto level', on: () => S.auto, run: () => { S.auto = !S.auto; dirty = true; say(S.auto ? 'Auto level on: each lane is scaled to its loudest part on screen.' : 'Auto level off: true loudness between the lanes.'); } },
  { code: 'KeyG', key: 'G', label: 'Boost quiet parts', on: () => S.boost, run: () => { S.boost = !S.boost; dirty = true; say(S.boost ? 'Quiet parts boosted.' : 'True loudness.'); } },
];
const ZOOMS = [['Song', 1], ['45 s', 2], ['12 s', 3], ['3 s', 4], ['0.6 s', 5]];

const HELP = [
  ['Play and scrub', [['Space', 'Play or stop both'], ['@Song strip (top)', 'Click or drag: scrub, you hear it'], ['@Marker’s tab', 'Drag it to scrub'], ['P', 'Centre the view on the playhead'], ['F', 'Follow the playhead while playing'], ['↑ / ↓', 'Marker to the previous / next bar (Shift: 4 bars)'], ['N / Shift N', 'Marker to the next / previous note start'], ['Home / End', 'Marker to the start / end']]],
  ['Zoom and scroll', [['1 2 3 4 5', 'Whole song, 45 s, 12 s, 3 s, 0.6 s'], ['+ / −', 'Zoom in / out around the playhead'], ['@Ctrl + wheel', 'Zoom at the pointer'], ['@Wheel, Shift + drag', 'Scroll the view'], [', / .', 'Scroll back / forward']]],
  ['Move the video', [['@Drag the waveform', 'Moves the section under the pointer'], ['← / →', 'Nudge 10 ms (Shift 100 ms, Ctrl 1 ms)'], ['M', 'Match here by the note starts (±1 s)']]],
  ['Sections and squeeze', [['A', 'Cut at the bar nearest the marker'], ['@Double-click', 'Cut at the bar nearest the pointer'], ['Delete', 'Join with the section before'], ['@Section’s name', 'Click to pick that section'], ['[ / ]', 'Squeeze / stretch the picked section (Shift 100 ms, Ctrl 1 ms)'], ['K', 'Lock it back to the tab’s tempo'], ['@Pink cut line', 'Drag: moves the boundary, squeezing both sides']]],
  ['Sound and look', [['T / V', 'Tab / video sound on or off'], ['E', 'One ear each'], ['O', 'Overlay or stacked'], ['L', 'Auto level (quiet notes get tall)'], ['G', 'Boost quiet parts'], ['@Loudness panel', 'A slider per instrument; M mutes, S solos; double-click = 100%']]],
  ['File', [['Ctrl S', 'Save'], ['Ctrl Z', 'Undo'], ['?', 'Open or close this list'], ['Esc', 'Close this list']]],
];
function buildChrome() {
  const zoom = $('#zoom');
  for (const [label, lv] of ZOOMS) {
    const b = document.createElement('button'), k = document.createElement('kbd');
    k.textContent = lv; b.append(k, label); b.dataset.z = lv; b.title = `Zoom ${label} (key ${lv})`;
    b.onclick = () => setLevel(lv); zoom.append(b);
  }
  for (const t of TOGGLES) {
    const b = document.createElement('button'), k = document.createElement('kbd'), dot = document.createElement('span');
    b.className = 'chip'; dot.className = 'dot'; k.textContent = t.key; b.dataset.t = t.code; b.title = `${t.label} (${t.key})`;
    b.append(dot, k, t.label); b.onclick = () => { t.run(); dirty = true; b.blur(); }; $('#toggles').append(b);
  }
  const grid = $('#helpgrid');
  for (const [title, rows] of HELP) {
    const box = document.createElement('div'), h = document.createElement('h4'); h.textContent = title; box.append(h);
    for (const [keys, what] of rows) {
      const row = document.createElement('div'), k = document.createElement('span'), d = document.createElement('span');
      row.className = 'row'; k.className = 'k'; d.className = 'd'; d.textContent = what;

}
function paintChrome() {
  for (const b of $('#zoom').children) b.classList.toggle('on', Number(b.dataset.z) === S.level);
  for (const b of $('#toggles').querySelectorAll('.chip')) b.classList.toggle('on', TOGGLES.find((t) => t.code === b.dataset.t).on());
}
function toggleHelp(show) { $('#help').hidden = !show; }

/* ---------- input ---------- */
const timeAtX = (clientX) => { const r = cv.getBoundingClientRect(); return S.view.t0 + ((clientX - r.left) / r.width) * S.view.span; };
let drag = null;
// A plain drag moves the video (the section under the mouse gets that shift); Shift+drag or the right button scrolls the view.
// The song strip (top): click or drag to scrub. The section names: click to pick a section. A pink cut line: drag it.
const overT = (clientX) => { const r = cv.getBoundingClientRect(); return clamp(((clientX - r.left) / r.width) * S.total, 0, S.total); };
function cutAtX(clientX) { // the cut line within 6 px of the pointer, as a section index (0 = none)
  const r = cv.getBoundingClientRect();
  for (let k = 1; k < S.sec.length; k++) if (Math.abs(r.left + ((barT(S.sec[k].i) - S.view.t0) / S.view.span) * r.width - clientX) <= 6) return k;
  return 0;
}
function zoneAt(e) { // what the pointer is over: 'strip', 'band', 'handle' (the marker's tab), 'cut', or 'wave'
  const r = cv.getBoundingClientRect(), y = e.clientY - r.top;
  if (y < TOP) return 'strip';
  if (cutAtX(e.clientX)) return 'cut';
  if (y < TOP + 22) return 'band';
  const mx = r.left + ((S.marker - S.view.t0) / S.view.span) * r.width;
  if (y < TOP + 36 && Math.abs(e.clientX - mx) <= 10) return 'handle';
  return 'wave';
}
cv.addEventListener('mousedown', (e) => {
  if (!S.tab) return;
  const zone = e.button === 0 && !e.shiftKey ? zoneAt(e) : 'wave';
  if (zone === 'strip' || zone === 'handle') {
    drag = { special: true, scrub: zone, x: e.clientX };
    scrubAt = 0; scrubTo(zone === 'strip' ? overT(e.clientX) : timeAtX(e.clientX));
    if (zone === 'strip') panTo(S.marker - S.view.span / 2);
    return;
  }
  if (zone === 'cut') {
    const k = cutAtX(e.clientX);
    drag = { special: true, cut: k, x: e.clientX, sqL: S.sec[k - 1].sq || 0, sR: S.sec[k].s, sqR: S.sec[k].sq || 0, pushed: false };
    return;
  }
  if (zone === 'band') {
    S.selSec = secAt(timeAtX(e.clientX)); dirty = true; drag = { special: true };
    say(`Picked section ${S.selSec + 1}: ← → move it, [ ] squeeze or stretch it, K locks it to the tab’s tempo.`);
    return;
  }
  const pan = e.shiftKey || e.button !== 0, k = secAt(timeAtX(e.clientX));

});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('dblclick', (e) => { if (S.tab && zoneAt(e) === 'wave') cutHere(timeAtX(e.clientX)); }); // a cut at the bar nearest the pointer, not the marker
window.addEventListener('mousemove', (e) => {
  if (drag?.scrub) {
    scrubTo(drag.scrub === 'strip' ? overT(e.clientX) : timeAtX(e.clientX));
    if (drag.scrub === 'strip') panTo(S.marker - S.view.span / 2);
  } else if (drag?.cut) {
    const r = cv.getBoundingClientRect(), ms = Math.round(((e.clientX - drag.x) / r.width) * S.view.span * 1000), k = drag.cut;
    if (ms !== 0 && !drag.pushed) { drag.pushed = true; pushUndo(true); }
    if (drag.pushed) { // the boundary's video moves with the pointer: the section before it is squeezed or stretched, and so is the one after
      S.sec[k - 1].sq = drag.sqL + ms; S.sec[k].s = drag.sR + ms; S.sec[k].sq = drag.sqR - ms;
      changed();
      say(`Cut at bar ${S.bars[S.sec[k].i][1]} moved ${fmtMs(ms)}: section ${k}: ${squeezeNote(k - 1)}; section ${k + 1}: ${squeezeNote(k)}.`);
    }
  } else if (drag && !drag.special) {
    const r = cv.getBoundingClientRect(), dx = e.clientX - drag.x;
    if (Math.abs(dx) > 4) drag.moved = true;
    if (drag.moved && drag.pan) panTo(drag.t0 - (dx / r.width) * S.view.span);
    else if (drag.moved) {
      if (!drag.pushed) { drag.pushed = true; pushUndo(true); }
      S.sec[drag.k].s = Math.round(drag.s0 + (dx / r.width) * S.view.span * 1000);
      changed();
      say(`Section ${drag.k + 1}: video moved ${fmtMs(S.sec[drag.k].s)} (right = later)`);
    }
  }
  const r = cv.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  S.hover = inside ? clamp(timeAtX(e.clientX), 0, S.total) : null;
  if (inside && S.tab && !drag) { const z = zoneAt(e); cv.style.cursor = z === 'cut' ? 'ew-resize' : z === 'strip' || z === 'band' ? 'pointer' : z === 'handle' ? 'grab' : 'crosshair'; }
  dirty = true;
});
window.addEventListener('mouseup', (e) => {
  if (drag?.scrub) { scrubAt = 0; scrubTo(S.marker); } // a last burst at the exact spot where the scrub stopped
  else if (drag && !drag.special && !drag.moved && S.tab) { S.marker = clamp(timeAtX(e.clientX), 0, S.total); dirty = true; }
  drag = null;
});
cv.addEventListener('mouseleave', () => { S.hover = null; dirty = true; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (!S.tab) return;
  if (e.ctrlKey || e.metaKey) { const at = timeAtX(e.clientX); const lv = clamp(S.level + (e.deltaY < 0 ? 1 : -1), 1, 5); if (lv !== S.level) { S.marker = clamp(at, 0, S.total); setLevel(lv); } return; }

document.addEventListener('keydown', (e) => {
  if (!$('#help').hidden) { if (e.code === 'Escape' || e.key === '?') { toggleHelp(false); e.preventDefault(); } return; }
  if (e.target.matches?.('select, input, textarea')) { if (e.code !== 'Space') return; e.target.blur(); }
  else if (e.target.matches?.('button')) e.target.blur(); // a clicked button must not swallow Space or Enter: the shortcuts keep working
  if (e.key === '?') { toggleHelp(true); e.preventDefault(); return; }
  if (!S.tab) return;
  const key = e.code;
  const step = e.shiftKey ? 100 : e.ctrlKey || e.altKey ? 1 : 10;
  let used = true;
  const digit = /^(Digit|Numpad)([1-5])$/.exec(key);
  if (e.ctrlKey && key === 'KeyS') save();
  else if (e.ctrlKey && key === 'KeyZ') undo();
  else if (digit && !e.ctrlKey) setLevel(Number(digit[2]));
  else if (key === 'ArrowLeft') nudge(-step);
  else if (key === 'ArrowRight') nudge(step);
  else if (key === 'BracketLeft') squeeze(-step);
  else if (key === 'BracketRight') squeeze(step);
  else if (key === 'KeyK') lockTempo();
  else if (key === 'KeyP') toPlayhead();
  else if (key === 'KeyF') toggleFollow();
  else if ((key === 'Equal' || key === 'NumpadAdd') && !e.ctrlKey && !e.metaKey) zoomBy(1);
  else if ((key === 'Minus' || key === 'NumpadSubtract') && !e.ctrlKey && !e.metaKey) zoomBy(-1);
  else if (key === 'KeyN') moveMarkerNote(e.shiftKey ? -1 : 1);
  else if (key === 'ArrowUp') moveMarkerBar(e.shiftKey ? -4 : -1);
  else if (key === 'ArrowDown') moveMarkerBar(e.shiftKey ? 4 : 1);
  else if (key === 'Comma' || key === 'PageUp') panTo(S.view.t0 - S.view.span * 0.8);
  else if (key === 'Period' || key === 'PageDown') panTo(S.view.t0 + S.view.span * 0.8);
  else if (key === 'Home') { S.marker = 0; showMarker(); dirty = true; }
  else if (key === 'End') { S.marker = S.total; showMarker(); dirty = true; }
  else if (key === 'Space') togglePlay();
  else if (TOGGLES.some((t) => t.code === key) && !e.ctrlKey && !e.metaKey) { TOGGLES.find((t) => t.code === key).run(); dirty = true; }
  else if (key === 'KeyA') cutHere();
  else if (key === 'Delete' || key === 'Backspace') joinHere();
  else if (key === 'KeyM') matchHere();

});
function toggleFollow() {
  S.follow = !S.follow; $('#follow').classList.toggle('on', S.follow);
  say(S.follow ? 'Follow on: the playhead stays in the middle while playing.' : 'Follow off.');
  if (S.follow) toPlayhead();
}
$('#play').onclick = togglePlay; $('#match').onclick = matchHere; $('#cut').onclick = () => cutHere(); $('#uncut').onclick = joinHere;
$('#head').onclick = toPlayhead; $('#follow').onclick = toggleFollow;
$('#helpbtn').onclick = () => toggleHelp(true); $('#helpx').onclick = () => toggleHelp(false);
$('#help').addEventListener('mousedown', (e) => { if (e.target === $('#help')) toggleHelp(false); });
$('#sq').onclick = (e) => squeeze(e.shiftKey ? -100 : -10); $('#st').onclick = (e) => squeeze(e.shiftKey ? 100 : 10); $('#lock').onclick = lockTempo;
$('#undo').onclick = undo; $('#reset').onclick = reset; $('#save').onclick = save;
$('#song').onchange = (e) => openSong(e.target.value);
new ResizeObserver(resize).observe($('main'));
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  buildChrome();
  resize(); requestAnimationFrame(loop);
  const list = await (await fetch('/api/songs')).json();
  if (!list.length) { hint('No song to line up yet. Make one with: python tests/yt2gp5/fromlink.py "<youtube link>"'); return; }
  for (const s of list) $('#song').add(new Option(s.name, s.slug));
  const want = new URLSearchParams(location.search).get('song');
  if (want && list.some((s) => s.slug === want)) $('#song').value = want;
  openSong($('#song').value);
})();
</script>
